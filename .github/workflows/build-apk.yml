name: Build Shamrock APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          set -e
          chmod +x ./gradlew
          if [ -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            export KEYSTORE_PATH="$(pwd)/keystore.jks"
            export KEYSTORE_PASSWORD="${{ secrets.SIGN_KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.SIGN_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.SIGN_KEY_PASSWORD }}"
            ./gradlew :app:assembleAppRelease --build-cache --parallel --stacktrace
          else
            ./gradlew :app:assembleAppDebug :xposed:assembleRelease --build-cache --parallel --stacktrace
          fi

      - name: List artifacts
        run: find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Compute SHA256
        run: |
          echo "### Build Success :cat:" >> $GITHUB_STEP_SUMMARY
          echo "|ABI|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:-|:-|" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name '*.apk' | while read apk; do
            sum=$(sha256sum "$apk" | awk '{print $1}')
            echo "|$(basename "$apk")|$sum|" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shamrock-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
