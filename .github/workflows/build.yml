name: Build Shamrock

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug :xposed:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: shamrock-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload xposed AAR
        uses: actions/upload-artifact@v4
        with:
          name: shamrock-xposed-aar
          path: xposed/build/outputs/aar/*.aar
          retention-days: 7
          if-no-files-found: warn
