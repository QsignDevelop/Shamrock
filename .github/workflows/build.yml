name: Build Shamrock

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Build Shamrock
      run: |
        cd Shamrock-master
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shamrock-apk
        path: Shamrock-master/app/build/outputs/apk/debug/*.apk
        retention-days: 7
    
    - name: Upload xposed APK
      uses: actions/upload-artifact@v4
      with:
        name: shamrock-xposed-apk
        path: Shamrock-master/xposed/build/outputs/aar/*.aar
        retention-days: 7