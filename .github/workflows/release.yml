name: Shamrock Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          chmod +x ./gradlew
          ./gradlew :app:assembleAppRelease :app:assembleArm64Release --build-cache --parallel --stacktrace
          echo "APK_FILE_ALL=$(find app/build/outputs/apk/app/release -name '*.apk' | head -1)" >> $GITHUB_ENV
          echo "APK_FILE_ARM64=$(find app/build/outputs/apk/arm64/release -name '*.apk' | head -1)" >> $GITHUB_ENV

      - name: Install aapt
        run: sudo apt-get update && sudo apt-get install -y aapt

      - name: Read Shamrock version
        run: |
          apk_file="${{ env.APK_FILE_ALL }}"
          version_name=$(aapt dump badging "$apk_file" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "SHAMROCK_VERSION=$version_name" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shamrock Neko v${{ env.SHAMROCK_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_FILE_ALL }}
            ${{ env.APK_FILE_ARM64 }}
